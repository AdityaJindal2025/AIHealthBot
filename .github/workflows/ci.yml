name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Migrations apply to a fresh database
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head && alembic check
      - name: Corpus build report is up to date
        run: python -m app.rag.report --check

  postgres:
    # Migrations on real Postgres + pgvector, and PgVectorStore vs MemoryStore ranking parity (FAP §6.2).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nutrition
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutrition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Migrations apply on Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nutrition
        run: alembic upgrade head && alembic check
      - run: pytest -q tests/test_store_pg.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # PageProps/LayoutProps are generated types (next dev/build/typegen); a fresh checkout has none.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - name: No model credentials in the bundle
        run: "! grep -r 'gsk_' .next/static"
