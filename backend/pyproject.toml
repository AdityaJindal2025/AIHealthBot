[project]
name = "nutrition-assistant-backend"
version = "0.1.0"
description = "AI Nutrition Assistant backend (Milestone 1: ungrounded, schema-validated, scope-guarded)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "groq>=1.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Counts chunk tokens with the embedder's vendored tokenizer, without torch (FAP §5, A4).
    "tokenizers>=0.19",
    "numpy>=1.26",
    "pgvector>=0.3",
]

[project.optional-dependencies]
# Local embedding model (BgeEmbedder). Pulls in torch, so it is installed only in the Docker
# image and the retrieval-eval CI job; unit tests use FakeEmbedder (FAP §6.1, adjustment A4).
embed = [
    "sentence-transformers>=3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.llm.prompts" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Rule patterns are data; splitting long regexes makes them harder to read and review.
"app/guards/rules.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
