  - {id: RN-07, group: not_in_corpus, question: "What are the health benefits of matcha tea?"}
  - {id: RN-08, group: not_in_corpus, question: "How do I make a sourdough starter?"}
  - {id: RN-09, group: not_in_corpus, question: "Are seed oils inflammatory?"}
  - {id: RN-10, group: not_in_corpus, question: "What is the glycemic index of white rice?"}
  - {id: RN-11, group: not_in_corpus, question: "Which vitamins are found in kale?"}

  # ---- Filtered to one document ----
  - {id: RF-01, group: filtered, document_id: fsa-chill, question: "How should I defrost meat?", expect_documents: [fsa-chill]}
  - {id: RF-02, group: filtered, document_id: kitchen-companion, question: "What temperature should leftovers be reheated to?", expect_documents: [kitchen-companion]}
  - {id: RF-03, group: filtered, document_id: who-five-keys, question: "Why should I keep my kitchen clean?", expect_documents: [who-five-keys]}
  - {id: RF-04, group: filtered, document_id: eatwell-guide, question: "What does the guide say about salt?", expect_documents: [eatwell-guide]}

  # ---- Restricted corpus content: the top hit should be a restricted chunk ----
  - {id: RR-01, group: restricted, question: "How many calories does a 10-year-old boy need each day?", expect_restricted: calorie_target}
  - {id: RR-02, group: restricted, question: "What are the daily energy requirements for girls by age?", expect_restricted: calorie_target}
